name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip release]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve next version
        id: version
        run: |
          set -euo pipefail
          git fetch --tags --force

          latest="$(git tag -l 'v*.*.*' --sort=-v:refname | head -n1 || true)"
          if [ -z "${latest}" ]; then
            major=1
            minor=0
            patch=0
          else
            ver="${latest#v}"
            IFS=. read -r major minor patch <<< "${ver}"
          fi

          msg="${{ github.event.head_commit.message }}"
          if printf '%s' "${msg}" | grep -q '#major'; then
            major=$((major + 1))
            minor=0
            patch=0
          elif printf '%s' "${msg}" | grep -q '#minor'; then
            minor=$((minor + 1))
            patch=0
          else
            if [ -z "${latest}" ]; then
              :
            else
              patch=$((patch + 1))
            fi
          fi

          version="v${major}.${minor}.${patch}"

          if git rev-parse -q --verify "refs/tags/${version}" >/dev/null; then
            echo "Tag ${version} already exists; skipping release."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "skip=false" >> "${GITHUB_OUTPUT}"
          echo "Next release: ${version} (previous: ${latest:-none})"

      - name: Setup Node
        if: steps.version.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        if: steps.version.outputs.skip != 'true'
        run: npm ci

      - name: Build zip
        if: steps.version.outputs.skip != 'true'
        run: npm run build
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Tag and publish release
        if: steps.version.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ZIP="dist/shift-manager-offline-${VERSION}.zip"
          test -f "${ZIP}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "Shift Manager ${VERSION}"
          git push origin "refs/tags/${VERSION}"

          gh release create "${VERSION}" \
            "${ZIP}" \
            "dist/shift-manager-offline.zip" \
            --title "Shift Manager ${VERSION}" \
            --generate-notes

      - name: Prune older releases (keep latest 3)
        if: steps.version.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          KEEP=3
          # Newest first (v1.0.6, v1.0.5, …)
          mapfile -t tags < <(git tag -l 'v*.*.*' --sort=-v:refname)
          if [ "${#tags[@]}" -le "${KEEP}" ]; then
            echo "Have ${#tags[@]} release tag(s); nothing to prune."
            exit 0
          fi
          for tag in "${tags[@]:${KEEP}}"; do
            echo "Deleting old release ${tag}"
            gh release delete "${tag}" --yes --cleanup-tag || true
          done
          echo "Kept: ${tags[*]:0:${KEEP}}"
